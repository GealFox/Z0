<svg
  width="128"
  height="128"
  viewBox="0 0 128 128"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Icono de derrame">

  <!-- Fondo circular -->
  <circle
    cx="64"
    cy="64"
    r="58"
    fill="#202428"
    stroke="#FFFFFF"
    stroke-width="5"/>

  <!-- Círculo exterior -->
  <circle
    cx="64"
    cy="64"
    r="52"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="4"
    stroke-opacity="0.4"/>

  <!-- Gota principal -->
  <path
    d="M64 30
       C64 30 44 54 44 70
       C44 82.2 53 92 64 92
       C75 92 84 82.2 84 70
       C84 54 64 30 64 30 Z"
    fill="#FFFFFF"
    fill-opacity="0.14"/>

  <!-- Contorno limpio de la gota -->
  <path
    d="M64 30
       C64 30 44 54 44 70
       C44 82.2 53 92 64 92
       C75 92 84 82.2 84 70
       C84 54 64 30 64 30 Z"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Pequeño indicio de derrame -->
  <path
    d="M54 98
       C58 100 62 101 66 100
       C70 99 74 98 78 98"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.8"/>

  <!-- Línea de contención inferior -->
  <path
    d="M44 108
       H84"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linecap="round"/>

</svg>

